name: Byte-match report

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install RGBDS 1.0.4
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/gbdev/rgbds/releases/download/v1.0.4/rgbds-linux-x86_64.tar.xz \
            --output rgbds.tar.xz
          mkdir rgbds-1.0.4
          tar -xJf rgbds.tar.xz -C rgbds-1.0.4
          echo "$PWD/rgbds-1.0.4" >> "$GITHUB_PATH"

      - name: Build the byte-exact cartridge
        run: make battletanx.gbc

      - name: Generate objdiff v2 report
        run: python3 tools/bytematch_report.py --out report.json

      - name: Upload USA report
        uses: actions/upload-artifact@v4
        with:
          name: USA_report
          path: report.json
          if-no-files-found: error
